name = "crm-ac"
main = "src/server/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "crm-ac-db"
database_id = "8a981c61-9b5d-400d-bce0-d2788ce159c5"
migrations_dir = "drizzle/migrations"

[[r2_buckets]]
binding = "R2"
bucket_name = "crm-ac-storage"

[triggers]
crons = ["0 1 * * *"] # Daily at 01:00 UTC for WhatsApp routine maintenance check
